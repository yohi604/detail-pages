<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#27634e"><meta name="description" content="이미지와 GIF를 한 장의 긴 상세페이지로. 업로드하고, 순서를 정하고, GitHub Pages로 공유하세요."><title>디테일 플로우 — 상세페이지 스튜디오</title><link rel="stylesheet" href="./style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2327634e'/%3E%3Cpath d='M12 11h16v5H12zm0 8h16v4H12zm0 7h16v3H12z' fill='white'/%3E%3C/svg%3E"></head><body>
<div id="app"><aside class="sidebar"><a class="brand" href="./" aria-label="디테일 플로우 홈"><span class="brand-mark"><i></i><i></i><i></i></span><span>detail flow<span class="brand-small">상세페이지 스튜디오</span></span></a><button id="newProject" class="btn primary new-project"><span>＋</span> 새 상세페이지</button><div class="side-label">내 작업 <span id="projectCount"></span></div><nav id="projectList" aria-label="상세페이지 목록"></nav><div class="side-bottom"><button id="githubConnect" class="connection"><span class="github-icon">◉</span><span>GitHub 연결<small id="connectionLabel">연결하고 공유를 시작하세요</small></span><span class="status-dot"></span></button><button id="helpButton" class="quiet help">ⓘ 사용 가이드</button><div class="side-note">쌓아 올린 디자인, 하나의 링크로.</div></div></aside>
<div class="workspace"><header class="topbar"><div class="breadcrumb">내 작업 <span>/</span> <span id="breadcrumbTitle">불러오는 중</span></div><div class="top-actions"><span id="saveState" class="save-state">● 이 브라우저에 저장</span><button id="exportButton" class="btn">내보내기</button><button id="publishButton" class="btn primary"><span>↗</span> 게시 · 공유</button></div></header><section class="project-header"><div><div class="eyebrow">DETAIL PAGE WORKSPACE</div><input id="projectTitle" class="title-input" value="불러오는 중" maxlength="100" aria-label="상세페이지 제목"><p>이미지와 GIF를 연결해, 완성된 페이지로 보여주세요.</p></div><button id="previewButton" class="btn preview-open">전체 미리보기 ↗</button></section>
<div class="editor"><section class="asset-panel"><div class="panel-heading"><h2>페이지 구성 <span id="itemCount" class="count-badge">0</span></h2><button id="sortButton" class="quiet" title="파일명 순서로 정렬">이름순 정렬 ↓</button></div><div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="이미지 또는 GIF 업로드"><span class="upload-symbol">↑</span><strong>이미지 · GIF 추가하기</strong><small>여기에 놓거나 클릭해 선택하세요</small><span class="file-types">JPG · PNG · WEBP · GIF</span></div><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input id="replaceInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><div class="list-hint"><span>⠿ 드래그해서 순서를 바꿔보세요</span><div><button id="undoButton" class="icon-btn" title="실행 취소" aria-label="실행 취소">↶</button><button id="redoButton" class="icon-btn" title="다시 실행" aria-label="다시 실행">↷</button></div></div><div id="assetList" class="asset-list"></div><div class="asset-footer"><span id="totalSize">원본 화질 유지</span><span>GIF 자동 재생</span></div></section>
<section class="preview-panel"><div class="preview-toolbar"><div class="live-label"><span></span> 실시간 미리보기</div><div class="device-toggle"><button id="desktopButton" class="active" aria-pressed="true">▣ 데스크톱</button><button id="mobileButton" aria-pressed="false">▯ 모바일</button></div><button id="settingsButton" class="quiet">보기 설정 ⚙</button></div><div id="settingsPanel" class="settings-panel" hidden><label>페이지 너비 <select id="pageWidth"><option value="750">750 px</option><option value="860">860 px</option><option value="1000">1,000 px</option><option value="1200">1,200 px</option></select></label><label>이미지 간격 <select id="pageGap"><option value="0">여백 없이</option><option value="8">8 px</option><option value="16">16 px</option><option value="24">24 px</option></select></label><label>배경색 <input type="color" id="pageBg" value="#ffffff"></label></div><div id="previewScroller" class="preview-scroller"><div class="canvas-meta"><span id="canvasName">상세페이지</span><span id="canvasWidth">860 px</span></div><div id="previewCanvas" class="preview-canvas"></div><div class="canvas-end"><span></span> 상세페이지 끝 <span></span></div></div><div class="preview-footer"><span id="visibleSummary">전체 페이지</span><span id="previewHint">공유된 페이지에는 이미지와 GIF만 표시돼요</span></div></section></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><dialog id="modal"><div id="modalContent"></div><button id="closeModal" class="modal-close" aria-label="닫기">×</button></dialog><script type="module" src="./app.js"></script></body></html>
